name: Validate Claude Code plugin

on:
  pull_request:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

# Read-only token: the workflow never writes to the repository.
permissions:
  contents: read

concurrency:
  group: validate-plugin-${{ github.ref }}
  cancel-in-progress: true

env:
  # Number of skills the plugin must contain. Update it when skills are added or removed.
  EXPECTED_SKILL_COUNT: "162"

jobs:
  validate:
    name: Skills, manifest and plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Third-party actions are pinned to full commit SHAs (tag in the comment).
      # Dependabot (.github/dependabot.yml) proposes updates.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML (pinned, hash-checked)
        run: python -m pip install --disable-pip-version-check --no-input --require-hashes -r tools/ci/requirements.txt

      - name: Count SKILL.md files
        run: |
          count=$(find . -name SKILL.md -not -path './.git/*' -not -path '*/node_modules/*' | wc -l)
          echo "Found $count SKILL.md files (expected $EXPECTED_SKILL_COUNT)"
          if [ "$count" -ne "$EXPECTED_SKILL_COUNT" ]; then
            echo "::error::Expected $EXPECTED_SKILL_COUNT SKILL.md files, found $count"
            exit 1
          fi

      - name: Check marketplace.json is valid JSON
        run: |
          python - <<'EOF'
          import json, sys
          path = ".claude-plugin/marketplace.json"
          try:
              data = json.load(open(path, encoding="utf-8"))
          except (OSError, ValueError) as exc:
              print(f"::error file={path}::{exc}")
              sys.exit(1)
          plugins = data.get("plugins") or []
          missing = [k for k in ("name", "owner", "plugins") if k not in data]
          if missing or not plugins:
              print(f"::error file={path}::missing keys or empty plugins list: {missing}")
              sys.exit(1)
          for p in plugins:
              print(f"plugin {p.get('name')} v{p.get('version')}: {len(p.get('skills', []))} skills")
          EOF

      - name: Validate skills and manifest (tools/validate_plugin.py)
        run: python3 tools/validate_plugin.py --expected "$EXPECTED_SKILL_COUNT"

      # Unit and regression tests for the skill scripts: per-platform fee models,
      # Amazon outputs compared with golden files, every documented example run,
      # shared script copies kept identical across each family.
      - name: Run script tests (tests/)
        run: python3 -m unittest discover -s tests -v

      - name: Set up Node.js
        id: node
        continue-on-error: true
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Installs the Claude Code version locked in tools/ci/package-lock.json:
      # `npm ci` checks every package against its lockfile integrity hash and
      # `npm audit signatures` checks the npm registry signatures. If either
      # cannot run here, the CLI is not used and the next step is skipped with a warning.
      - name: Install Claude Code CLI (locked, integrity and signature checked)
        id: claude_cli
        if: steps.node.outcome == 'success'
        continue-on-error: true
        working-directory: tools/ci
        run: |
          npm ci --no-audit --no-fund
          npm audit signatures

      - name: claude plugin validate
        if: steps.claude_cli.outcome == 'success'
        env:
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          claude_bin="$GITHUB_WORKSPACE/tools/ci/node_modules/.bin/claude"
          "$claude_bin" --version
          "$claude_bin" plugin validate .

      - name: Report skipped CLI validation
        if: steps.claude_cli.outcome != 'success'
        run: echo "::warning::Claude Code CLI could not be installed and verified; 'claude plugin validate' was skipped. The Python checks above still passed."
